# Composite indexes below are sized to the GraphQL queries the backend actually
# sends (Hasura logs), not guessed: each leads with the column every such query
# filters on by equality, then the column it ranges or sorts on.
type Swap
  @storage(postgres: true)
  @index(fields: ["pool", ["timestamp", "DESC"]])
  # Per-pool swap pages ordered or ranged by id.
  @index(fields: ["pool", "id"])
  # Latest swap per chain (`chainId _eq`, `timestamp _lt`, order timestamp desc).
  @index(fields: ["chainId", ["timestamp", "DESC"]]) {
  id: ID!
  chainId: BigInt!
  transaction: String! # Instead of Transaction reference
  timestamp: BigInt!
  pool: String! # Instead of Pool reference
  token0: Token! # Changed from String to Token reference
  token1: Token! # Changed from String to Token reference
  sender: String! # Instead of Bytes
  origin: String! # Instead of Bytes
  amount0: BigDecimal!
  amount1: BigDecimal!
  amountUSD: BigDecimal!
  sqrtPriceX96: BigInt!
  tick: BigInt!
  logIndex: BigInt!
  # The raw PoolManager Swap.fee, in hundredths of a bip: the COMBINED swap fee,
  # LP fee plus protocol fee. For dynamic-fee pools this is the only place the
  # per-swap effective fee is kept (Pool.feeTier stays the dynamic-fee flag).
  # The LPs' share of the swap's input is this minus the protocol fee of the
  # swap's direction (see Pool.protocolFee), and that is what the fee totals use.
  fee: BigInt!
}

type PoolManager @storage(postgres: true) {
  id: ID!
  chainId: BigInt!
  poolCount: BigInt!
  txCount: BigInt!
  totalVolumeUSD: BigDecimal!
  totalVolumeETH: BigDecimal!
  totalFeesUSD: BigDecimal!
  totalFeesETH: BigDecimal!
  untrackedVolumeUSD: BigDecimal!
  totalValueLockedUSD: BigDecimal!
  totalValueLockedETH: BigDecimal!
  totalValueLockedUSDUntracked: BigDecimal!
  totalValueLockedETHUntracked: BigDecimal!
  owner: String!
  numberOfSwaps: BigInt! # total swaps on network
  hookedPools: BigInt! # number of pools with hooks
  hookedSwaps: BigInt! # number of swaps through hooked pools
}

type Pool
  @storage(postgres: true)
  @index(fields: ["chainId", ["totalValueLockedUSD", "DESC"]])
  @index(fields: ["hooks", "chainId", ["totalValueLockedUSD", "DESC"]])
  # Top pools per chain by volume.
  @index(fields: ["chainId", ["volumeUSD", "DESC"]])
  # Pools created on a chain after a given block.
  @index(fields: ["chainId", "createdAtBlockNumber"]) {
  id: ID!
  chainId: BigInt!
  name: String!
  createdAtTimestamp: BigInt! @index
  createdAtBlockNumber: BigInt!
  token0: String! @index # Instead of Token reference
  token1: String! @index # Instead of Token reference
  # The PoolKey fee exactly as set at Initialize, and never rewritten. A
  # dynamic-fee pool keeps the 0x800000 (8388608) flag here, which is not a rate;
  # the rate an individual swap paid is on Swap.fee.
  feeTier: BigInt!
  # PoolManager's packed uint24 protocol fee for this pool, set by
  # ProtocolFeeUpdated and 0 until then. Low 12 bits apply to zeroForOne swaps,
  # high 12 bits to oneForZero swaps, each in hundredths of a bip (max 1000).
  # It is taken out of the swap fee, so the LP fee rate of a swap is
  # Swap.fee minus the field for its direction.
  protocolFee: BigInt!
  liquidity: BigInt!
  sqrtPrice: BigInt!
  token0Price: BigDecimal!
  token1Price: BigDecimal!
  tick: BigInt
  tickSpacing: BigInt!
  observationIndex: BigInt!
  volumeToken0: BigDecimal!
  volumeToken1: BigDecimal!
  volumeUSD: BigDecimal!
  untrackedVolumeUSD: BigDecimal!
  feesUSD: BigDecimal!
  feesUSDUntracked: BigDecimal!
  txCount: BigInt!
  collectedFeesToken0: BigDecimal!
  collectedFeesToken1: BigDecimal!
  collectedFeesUSD: BigDecimal!
  # Tokens handed to this pool's in-range LPs through PoolManager.donate, summed
  # over the pool's life (hooks and routers use it to pay out fees). Kept apart
  # from feesUSD / collectedFees*, which are swap fees priced at the LP fee
  # rate: a donation is not a fee on any swap, and a 0% pool can still have one.
  # A donation does raise totalValueLocked*, because the tokens enter the pool.
  donatedToken0: BigDecimal!
  donatedToken1: BigDecimal!
  donatedUSD: BigDecimal!
  totalValueLockedToken0: BigDecimal!
  totalValueLockedToken1: BigDecimal!
  totalValueLockedETH: BigDecimal!
  totalValueLockedUSD: BigDecimal!
  totalValueLockedUSDUntracked: BigDecimal!
  liquidityProviderCount: BigInt!
  hooks: String!
  # derived fields
  ticks: [Tick!]! @derivedFrom(field: "pool")
  poolHourData: [PoolHourData!]! @derivedFrom(field: "pool")
  poolDayData: [PoolDayData!]! @derivedFrom(field: "pool")
}

type Tick
  @storage(postgres: true)
  @index(fields: ["pool", "tickIdx"]) {
  id: ID! # <pool address>#<tickIdx>
  chainId: BigInt!
  pool: Pool! # Pointer back to Pool
  tickIdx: BigInt!
  liquidityGross: BigInt! # abs liquidity at this boundary
  liquidityNet: BigInt! # delta when price crosses boundary
  price0: BigDecimal! # Optional – 1.0001^tickIdx
  price1: BigDecimal! # Optional inverse price
  createdAtTimestamp: BigInt!
  createdAtBlockNumber: BigInt!
}

type Token @storage(postgres: true) {
  id: ID!
  chainId: BigInt! @index
  symbol: String!
  name: String!
  decimals: BigInt!
  # Did the CONTRACT answer for `decimals`, or is the value above the 18 fallback?
  # `false` means every amount scaled by this token is only as good as that guess
  # (a real 6-decimal token read as 18 is wrong by 10^12), so a consumer that
  # cares about exactness must gate on this rather than trust a bare `18`.
  # Mirrors Ponder's `decimalsResolved`. Written once, at the two creation sites
  # in src/handlers/initialize-handler.ts, and never rewritten afterwards: a row
  # that lands `false` stays `false` for the run. Upgrading it in place was tried
  # and removed — amounts already derived from the guessed 18 (totalFeesCollected0
  # among them) stay wrong, and an upgrade that lands whenever RPC health allowed
  # makes the same block range produce different entity values run to run.
  # The fix for a `false` row is a resync once the RPC is healthy: the effect
  # cache refuses to persist an unresolved read, so the retry actually happens.
  decimalsResolved: Boolean!
  totalSupply: BigInt!
  volume: BigDecimal!
  volumeUSD: BigDecimal!
  untrackedVolumeUSD: BigDecimal!
  feesUSD: BigDecimal!
  txCount: BigInt!
  poolCount: BigInt!
  totalValueLocked: BigDecimal!
  totalValueLockedUSD: BigDecimal!
  totalValueLockedUSDUntracked: BigDecimal!
  derivedETH: BigDecimal!
  whitelistPools: [String!]! # Changed from Pool reference to String for simplicity
  # derived fields
  tokenDayData: [TokenDayData!]! @derivedFrom(field: "token")
  tokenHourData: [TokenHourData!]! @derivedFrom(field: "token")
}

# stores for USD calculations
type Bundle @storage(postgres: true) {
  id: ID!
  # price of ETH in usd
  ethPriceUSD: BigDecimal!
}

type HookStats @storage(postgres: true) {
  id: ID! # hook address
  chainId: BigInt!
  numberOfPools: BigInt!
  numberOfSwaps: BigInt!
  firstPoolCreatedAt: BigInt!
  totalValueLockedUSD: BigDecimal! @index # Total TVL across all pools using this hook
  totalVolumeUSD: BigDecimal! # Total volume across all pools using this hook
  untrackedVolumeUSD: BigDecimal! # Untracked volume for non-whitelisted tokens
  totalFeesUSD: BigDecimal! # Total fees across all pools using this hook
}

type Position
  @storage(postgres: true)
  # The backend's change feed: `chainId _eq`, `updatedAtBlock _gt`, ordered by
  # (updatedAtBlock, id). A single-column updatedAtBlock index can't serve it,
  # because block numbers from other chains interleave in the same range.
  @index(fields: ["chainId", "updatedAtBlock", "id"]) {
  id: ID! # <chainId>_<tokenId>
  chainId: BigInt!
  tokenId: BigInt! @index
  owner: String! @index # address of current owner
  origin: String! # the EOA that minted the position

  # ─── Liquidity position state ──────────────────────────────────────────────
  # Sourced entirely from ModifyLiquidity, whose `salt` IS the tokenId. No RPC.
  poolId: String! @index
  tickLower: BigInt!
  tickUpper: BigInt!
  liquidity: BigInt! # raw liquidity units, running sum of liquidityDelta
  isActive: Boolean! @index # liquidity > 0
  # false ⇒ amounts are NOT physically trustworthy (degenerate-pool guard).
  isPriceable: Boolean!

  createdAtTimestamp: BigInt!
  createdAtBlockNumber: BigInt!
  closedAtTimestamp: BigInt # null while open

  # ─── Cashflow aggregates, human-readable token units ──────────────────────
  depositedToken0: BigDecimal!
  depositedToken1: BigDecimal!
  withdrawnToken0: BigDecimal!
  withdrawnToken1: BigDecimal!
  totalFeesCollected0: BigDecimal!
  totalFeesCollected1: BigDecimal!
  # Uncollected fees are not stored: the indexer's sweep was removed, and the
  # Tickwise backend computes them on chain.

  # ─── Current in-pool amounts, human units ─────────────────────────────────
  # Pure math: getAmount0/1(ticks, pool.tick, liquidity, pool.sqrtPrice).
  # pool.tick and pool.sqrtPrice come from Initialize/Swap, and in v4 only a
  # swap moves the tick — so this needs NO eth_call, unlike Ponder's getSlot0.
  amount0: BigDecimal!
  amount1: BigDecimal!

  totalGasCostETH: BigDecimal! # human, chain-native token

  # ─── Change-feed watermark ────────────────────────────────────────────────
  # `updatedAtBlock` moves ONLY when the position itself changed (a
  # ModifyLiquidity or a Transfer). The backend's live listener watches it as a
  # change feed and enqueues one refresh per row returned.
  updatedAtBlock: BigInt!
  updatedAtTimestamp: BigInt!

  # ─── Replay watermark: the LAST ModifyLiquidity folded into THIS row ───────
  # `(block, logIndex)` of the last ModifyLiquidity whose non-idempotent
  # arithmetic — `liquidity`, the deposited/withdrawn/fee/gas sums — was applied
  # to this row. Written ONLY by modifyLiquidity-handler, never by the Transfer
  # handler, which is exactly what makes it usable: it answers
  # "has this event already been counted into THIS position?" where
  # `updatedAtBlock` cannot, because a Transfer moves that in the same block as
  # the mint's ModifyLiquidity.
  #
  # It is what lets a re-processed range HEAL a position instead of freezing it.
  # The replay guard skips the shared accumulators (Pool, Tick, day/hour
  # rollups) because nothing can prove whether those were applied; a position's
  # aggregates all live on one row, so this pair proves it per event. Zero on a
  # fresh row, so a row that lost its ModifyLiquidity writes — the 12 stub
  # positions on Base, `poolId: ""` with a correct ledger behind them — rebuilds
  # from the replayed events in order, with no double count.
  lastModifyBlock: BigInt!
  lastModifyLogIndex: BigInt!

  # derived fields
  subscriptions: [Subscribe!]! @derivedFrom(field: "position")
  unsubscriptions: [Unsubscribe!]! @derivedFrom(field: "position")
  transfers: [Transfer!]! @derivedFrom(field: "position")
  positionTransactions: [PositionTransaction!]! @derivedFrom(field: "position")
}

# One row per position-touching event. The backend reads this for the detail
# transaction list and for all four position charts (PnL, assets, APR, div loss).
#
# `type` is part of the identity, not just a label: a single ModifyLiquidity can
# emit BOTH a WITHDRAW and a COLLECT_FEES row at the same txHash and logIndex,
# so the id must carry it or one of the two is silently dropped.
type PositionTransaction @storage(postgres: true) {
  id: ID! # <chainId>_<txHash>_<logIndex>_<type>
  chainId: BigInt!
  position: Position!
  tokenId: BigInt! @index
  txHash: String! @index
  logIndex: BigInt!
  type: PositionTransactionType!
  # Human units, signed: positive into the position, negative out of it.
  amount0: BigDecimal!
  amount1: BigDecimal!
  # Attributed to ONE row per transaction so the detail view cannot double-count
  # gas: a pure collect carries it, a withdraw-plus-fees puts it on the WITHDRAW
  # row and leaves the COLLECT_FEES row at zero.
  gasCostETH: BigDecimal!
  timestamp: BigInt! @index
  blockNumber: BigInt!
  sender: String!
}

enum PositionTransactionType {
  DEPOSIT
  WITHDRAW
  COLLECT_FEES
}

type Transfer @storage(postgres: true) {
  id: ID!
  chainId: BigInt!
  tokenId: BigInt! @index
  from: String! # address of previous owner
  to: String! # address of new owner
  transaction: String! # Instead of Transaction reference
  logIndex: BigInt!
  timestamp: BigInt! @index
  origin: String! # the EOA that initiated the tx
  position: Position!
}

type Subscribe @storage(postgres: true) {
  id: ID!
  chainId: BigInt!
  tokenId: BigInt! @index
  address: String! # address of subscriber
  transaction: String! # Instead of Transaction reference
  logIndex: BigInt!
  timestamp: BigInt! @index
  origin: String! # the EOA that initiated the tx
  position: Position!
}

type Unsubscribe @storage(postgres: true) {
  id: ID!
  chainId: BigInt!
  tokenId: BigInt! @index
  address: String! # address of unsubscriber
  transaction: String! # Instead of Transaction reference
  logIndex: BigInt!
  timestamp: BigInt! @index
  origin: String! # the EOA that initiated the tx
  position: Position!
}

type ModifyLiquidity
  @storage(postgres: true)
  @index(fields: ["pool", ["timestamp", "DESC"]])
  @index(fields: ["pool", "transaction"])
  # Latest event per chain.
  @index(fields: ["chainId", ["timestamp", "DESC"]]) {
  id: ID!
  chainId: BigInt!
  # Indexed because the fee-frame ORDINAL is derived from it: the handler counts
  # the rows of THIS transaction that carry the same `salt` and a strictly lower
  # `logIndex`, and that count is which same-salt `modifyLiquidity` call frame in
  # the transaction's call trace this event is. See the ORDINAL FRAME PAIRING
  # note in handlers/modifyLiquidity-handler.ts. Declared here rather than left
  # to `ensureQueryIndexes`, which would build it lazily on a hot table and pause
  # writes while it does.
  transaction: String! @index # Instead of Transaction reference
  timestamp: BigInt!
  pool: Pool! # Instead of Pool reference
  token0: Token! # Token reference like in Swap entity
  token1: Token! # Token reference like in Swap entity
  sender: String! # Instead of Bytes
  origin: String! # Instead of Bytes - the EOA that initiated the txn
  # The sixth ModifyLiquidity parameter, which the entity used to drop. It is
  # the position key's salt — the NFT tokenId when the caller is the
  # PositionManager — and it is what makes the ordinal above countable: without
  # it, two positions settled by one router transaction are indistinguishable
  # rows.
  salt: String!
  amount: BigInt! # amount of liquidity modified
  amount0: BigDecimal! # amount of token 0 modified
  amount1: BigDecimal! # amount of token 1 modified
  amountUSD: BigDecimal! @index # derived amount based on available prices of tokens
  tickLower: BigInt! # lower tick of the position
  tickUpper: BigInt! # upper tick of the position
  logIndex: BigInt! # index within the txn
}

# One PoolManager.donate call. Its presence is also the replay guard: the Pool,
# Token and PoolManager TVL it adds are running sums, so a re-delivered Donate
# must be recognised and skipped (see handlers/donate-handler.ts).
type Donation
  @storage(postgres: true)
  @index(fields: ["pool", ["timestamp", "DESC"]]) {
  id: ID! # <chainId>_<blockNumber>_<logIndex>, like Swap
  chainId: BigInt!
  transaction: String! # Instead of Transaction reference
  timestamp: BigInt!
  pool: String! # Instead of Pool reference
  sender: String! # Instead of Bytes
  origin: String! # Instead of Bytes
  amount0: BigDecimal! # human units, always >= 0 (the donor pays the pool)
  amount1: BigDecimal!
  amountUSD: BigDecimal! # priced at the tokens' stored derivedETH, like ModifyLiquidity
  logIndex: BigInt!
}

# Data accumulated and condensed into day stats for all of Uniswap, per chain
type UniswapDayData
  @storage(postgres: true)
  @index(fields: ["chainId", ["date", "DESC"]]) {
  id: ID! # <chainId>_<dayIndex>
  chainId: BigInt!
  date: Int! # unix timestamp of the start of the day (dayIndex * 86400)
  volumeETH: BigDecimal! # total daily volume on this chain, in ETH
  volumeUSD: BigDecimal! # total daily volume on this chain, in USD
  volumeUSDUntracked: BigDecimal! # untracked daily volume in USD - never written, always 0 (subgraph parity)
  feesUSD: BigDecimal! # fees in USD
  txCount: BigInt! # number of daily transactions - snapshot of PoolManager.txCount
  tvlUSD: BigDecimal! # tvl in USD - snapshot of PoolManager.totalValueLockedUSD
}

# Data accumulated and condensed into day stats for each pool
type PoolDayData
  @storage(postgres: true)
  @index(fields: ["pool", ["date", "DESC"]])
  # Latest day per chain.
  @index(fields: ["chainId", ["date", "DESC"]]) {
  id: ID! # <chainId>_<poolId>_<dayIndex>
  chainId: BigInt!
  date: Int! # unix timestamp of the start of the day (dayIndex * 86400)
  pool: Pool! # pointer back to Pool
  liquidity: BigInt! # in range liquidity at end of period
  sqrtPrice: BigInt! # current price tracker at end of period
  token0Price: BigDecimal! # price of token0 - derived from sqrtPrice
  token1Price: BigDecimal! # price of token1 - derived from sqrtPrice
  tick: BigInt # current tick at end of period
  tvlUSD: BigDecimal! # tvl derived in USD at end of period
  volumeToken0: BigDecimal! # volume in token0
  volumeToken1: BigDecimal! # volume in token1
  volumeUSD: BigDecimal! # volume in USD
  feesUSD: BigDecimal! # fees in USD
  txCount: BigInt! # number of transactions during period
  open: BigDecimal! # opening price of token0
  high: BigDecimal! # high price of token0
  low: BigDecimal! # low price of token0
  close: BigDecimal! # close price of token0
}

# hourly stats tracker for pool
type PoolHourData
  @storage(postgres: true)
  @index(fields: ["pool", ["periodStartUnix", "DESC"]]) {
  id: ID! # <chainId>_<poolId>_<hourIndex>
  chainId: BigInt!
  periodStartUnix: Int! # unix timestamp for start of hour
  pool: Pool! # pointer back to Pool
  liquidity: BigInt! # in range liquidity at end of period
  sqrtPrice: BigInt! # current price tracker at end of period
  token0Price: BigDecimal! # price of token0 - derived from sqrtPrice
  token1Price: BigDecimal! # price of token1 - derived from sqrtPrice
  tick: BigInt # current tick at end of period
  tvlUSD: BigDecimal! # tvl derived in USD at end of period
  volumeToken0: BigDecimal! # volume in token0
  volumeToken1: BigDecimal! # volume in token1
  volumeUSD: BigDecimal! # volume in USD
  feesUSD: BigDecimal! # fees in USD
  txCount: BigInt! # number of transactions during period
  open: BigDecimal! # opening price of token0
  high: BigDecimal! # high price of token0
  low: BigDecimal! # low price of token0
  close: BigDecimal! # close price of token0
}

# daily stats tracker for token
type TokenDayData
  @storage(postgres: true)
  @index(fields: ["token", ["date", "DESC"]]) {
  id: ID! # <chainId>_<tokenAddress>_<dayIndex>
  chainId: BigInt!
  date: Int! # unix timestamp of the start of the day (dayIndex * 86400)
  token: Token! # pointer back to Token
  volume: BigDecimal! # volume in token units
  volumeUSD: BigDecimal! # volume in derived USD
  untrackedVolumeUSD: BigDecimal! # volume in USD even on pools with less reliable USD values
  totalValueLocked: BigDecimal! # liquidity across all pools in token units
  totalValueLockedUSD: BigDecimal! # liquidity across all pools in derived USD
  priceUSD: BigDecimal! # price at end of period in USD
  feesUSD: BigDecimal! # fees in USD
  open: BigDecimal! # opening price USD
  high: BigDecimal! # high price USD
  low: BigDecimal! # low price USD
  close: BigDecimal! # close price USD
}

# hourly stats tracker for token
type TokenHourData
  @storage(postgres: true)
  @index(fields: ["token", ["periodStartUnix", "DESC"]]) {
  id: ID! # <chainId>_<tokenAddress>_<hourIndex>
  chainId: BigInt!
  periodStartUnix: Int! # unix timestamp for start of hour
  token: Token! # pointer back to Token
  volume: BigDecimal! # volume in token units
  volumeUSD: BigDecimal! # volume in derived USD
  untrackedVolumeUSD: BigDecimal! # volume in USD even on pools with less reliable USD values
  totalValueLocked: BigDecimal! # liquidity across all pools in token units
  totalValueLockedUSD: BigDecimal! # liquidity across all pools in derived USD
  priceUSD: BigDecimal! # price at end of period in USD
  feesUSD: BigDecimal! # fees in USD
  open: BigDecimal! # opening price USD
  high: BigDecimal! # high price USD
  low: BigDecimal! # low price USD
  close: BigDecimal! # close price USD
}
